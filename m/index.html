<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- user-scalable=no keeps a double-tap from zooming the artboard, which would
     break every coordinate the layout is authored in. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#313335">
<title>TURNitURE — Turn It Yours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Playfair+Display:wght@700&family=Archivo+Black&family=Space+Mono:wght@700&family=Caveat:wght@700&family=Abril+Fatface&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">

    <!-- ── header ───────────────────────────────────────────
         The wordmark alone at the top; everything you can press is in the
         bar along the bottom, where a thumb reaches.          -->
    <a class="logo" href="#" data-go="home" aria-label="TURNitURE home"></a>

    <div class="navbox" id="navbox" aria-hidden="true"></div>
    <nav class="nav">
      <button class="nav__tab" data-tab="images">Image</button>
      <button class="nav__tab" data-tab="sounds">Sound</button>
      <button class="nav__tab" data-tab="colors">Colors</button>
      <button class="nav__icon nav__icon--profile" data-go="profile" aria-label="Profile"></button>
      <button class="nav__icon nav__icon--cart" data-go="cart" aria-label="Cart"></button>
    </nav>

    <!-- ── main page ────────────────────────────────────── -->
    <section class="page page--home is-on" data-page="home">
      <h1 class="intro" id="intro">
        <span class="intro__line" id="introWord"><span class="intro__fx"><span class="word" id="word"></span></span></span>
        <span class="intro__line" id="introTagline"><span class="intro__fx">Turn It Yours</span></span>
        <span class="intro__line" id="introLogo"><span class="intro__fx"></span></span>
      </h1>
    </section>

    <!-- ── images / sounds page ─────────────────────────────
         One card at a time with its neighbours cropped at the screen edges.
         Swipe or use the arrows; tap the card to open it.              -->
    <section class="page page--picker" data-page="picker">
      <h2 class="picker__title" data-title>Turn your image into</h2>

      <div class="window" id="window"><div class="items" id="items"></div></div>

      <div class="pager">
        <button class="arrow arrow--prev" id="prev" aria-label="Previous">
          <svg viewBox="0 0 62 62" aria-hidden="true">
            <circle cx="31" cy="31" r="31" fill="currentColor"/>
            <path d="M26 17 L41 31 L26 45" fill="none" stroke="var(--bg)" stroke-width="7"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="dots" id="dots" aria-hidden="true"></div>
        <button class="arrow arrow--next" id="next" aria-label="Next">
          <svg viewBox="0 0 62 62" aria-hidden="true">
            <circle cx="31" cy="31" r="31" fill="currentColor"/>
            <path d="M26 17 L41 31 L26 45" fill="none" stroke="var(--bg)" stroke-width="7"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- ── make page (step 2 · 3) ───────────────────────────
         Same hooks as the desktop page, so make.js drives both unchanged. -->
    <section class="page page--make" data-page="make">
      <h2 class="make__title">Let&rsquo;s Make <span data-make-name></span></h2>

      <!-- step 2 — pick an input. Two squares, one over the other
           (Reference/MobileSelect). The live one becomes the whole screen
           once the camera or the mic is running. -->
      <div class="make__io" data-step="io">
        <button class="drop" data-kind="file">
          <span class="drop__label" data-drop-label>Drop Image</span>
          <input type="file" hidden data-file>
        </button>
        <button class="drop" data-kind="live">
          <video class="drop__cam" playsinline muted hidden></video>
          <span class="live__grid" aria-hidden="true"></span>
          <span class="drop__label" data-live-label>Live Image</span>
        </button>
      </div>

      <!-- what the mic is hearing, while it is hearing it -->
      <canvas class="wave" data-wave></canvas>
      <!-- and the one button that takes it -->
      <button class="shoot" data-shoot aria-label="Take it"><span></span></button>

      <!-- step 3 — the result: what went in above, what came out below -->
      <div class="make__out" data-step="out">
        <canvas class="make__src" data-src></canvas>
        <canvas class="make__canvas" data-canvas></canvas>
        <div class="scrub" data-scrub hidden>
          <div class="scrub__track"></div>
          <div class="scrub__knob" data-knob></div>
        </div>
        <div class="make__btns">
          <button class="rbtn" data-play aria-label="Play">
            <svg viewBox="0 0 92 92" aria-hidden="true">
              <path class="i-play" d="M36 28 L66 46 L36 64 Z"/>
              <path class="i-pause" d="M34 28h10v36H34z M48 28h10v36H48z"/>
            </svg>
          </button>
          <button class="rbtn rbtn--mode" data-mode>2D</button>
          <button class="rbtn rbtn--cart" data-cart>Cart</button>
          <button class="rbtn rbtn--again" data-again aria-label="Again">
            <svg viewBox="0 0 92 92" aria-hidden="true">
              <path d="M62 34a22 22 0 1 0 5 15" fill="none" stroke="currentColor"
                    stroke-width="8" stroke-linecap="round"/>
              <path d="M66 22v16H50"  fill="none" stroke="currentColor"
                    stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ── profile ──────────────────────────────────────────
         Same hooks as the desktop page, so profile.js drives both. -->
    <section class="page page--profile" data-page="profile">
      <button class="avatar" id="avatar" aria-label="Choose a profile picture">
        <span class="avatar__glyph"></span>
        <img class="avatar__img" alt="" hidden>
        <video class="avatar__cam" playsinline muted hidden></video>
        <span class="avatar__hint" data-avatar-hint hidden>Take It</span>
      </button>
      <div class="pick" id="avatarPick" hidden>
        <button class="pick__b" data-pick="live">Take one now</button>
        <button class="pick__b" data-pick="file">Choose a file</button>
      </div>
      <input type="file" accept="image/*" hidden id="avatarFile">

      <div class="pform" id="pform">
        <label class="pfield" data-k="name">
          <span class="pfield__k">Name</span>
          <input class="pfield__v" type="text" autocomplete="off" disabled>
        </label>
        <label class="pfield" data-k="mail">
          <span class="pfield__k">E-Mail</span>
          <input class="pfield__v" type="email" autocomplete="off" disabled>
        </label>
        <label class="pfield pfield--tall" data-k="addr">
          <span class="pfield__k">Address</span>
          <textarea class="pfield__v" autocomplete="off" disabled></textarea>
        </label>
      </div>

      <div class="pbtns">
        <button class="pbtn" id="pEdit">EDIT</button>
        <button class="pbtn pbtn--fill" id="pSave">SAVE</button>
      </div>
    </section>

    <!-- ── cart ─────────────────────────────────────────────
         Same hooks as the desktop page, so checkout.js drives both. The
         floor is above the bill here instead of beside it. -->
    <section class="page page--cart" data-page="cart" data-step="1">

      <h2 class="cart__title">YOUR OWN..</h2>
      <div class="floor" id="floor"></div>
      <p class="floor__empty" id="floorEmpty">Nothing in here yet.</p>

      <!-- step 1 — the bill along the bottom -->
      <div class="paper paper--side" data-cstep="1">
        <div class="paper__sheet"></div>
        <div class="paper__fold"></div>
        <div class="paper__in">
          <h3 class="paper__t">Bill-Paper</h3>
          <div class="rule"></div>
          <div class="bill" data-bill="side"></div>
          <div class="paper__btns">
            <button class="pill" id="cartBuy">Buy</button>
            <button class="rnd" id="cartTrash" aria-label="Empty the cart"></button>
            <button class="rnd" id="cartTicket" aria-label="Apply the coupon"></button>
          </div>
        </div>
      </div>

      <!-- steps 2 · 3 — the same sheet, opened out -->
      <div class="paper paper--wide" data-cstep="23">
        <div class="paper__sheet"></div>
        <div class="paper__fold"></div>
        <div class="paper__in">
          <h3 class="paper__t">Bill-Paper</h3>
          <div class="rule rule--wide"></div>
          <div class="bill bill--wide" data-bill="wide"></div>

          <form class="cform" data-cform="2" autocomplete="off">
            <div class="crow">
              <input class="cin" placeholder="First Name">
              <input class="cin" placeholder="Last Name">
            </div>
            <div class="crow"><input class="cin" placeholder="Apartment, Suite, etc (optional)"></div>
            <div class="crow"><input class="cin" placeholder="City"></div>
            <div class="crow crow--3">
              <span class="csel"><select data-sel="county"></select></span>
              <span class="csel"><select data-sel="zip"></select></span>
              <span class="csel"><select data-sel="country"></select></span>
            </div>
            <div class="crow"><input class="cin" placeholder="Optional"></div>
            <label class="ccheck"><input type="checkbox"><span class="ccheck__b"></span>Save it!</label>
            <button class="pill pill--wide" data-go-step="3">Continue</button>
          </form>

          <form class="cform" data-cform="3" autocomplete="off">
            <div class="crow"><input class="cin" placeholder="Cardholder Name"></div>
            <div class="crow"><input class="cin" placeholder="Card Number" inputmode="numeric"></div>
            <div class="crow crow--3">
              <span class="csel"><select data-sel="month"></select></span>
              <span class="csel"><select data-sel="year"></select></span>
              <input class="cin" placeholder="CVC" inputmode="numeric" maxlength="4">
            </div>
            <label class="ccheck"><input type="checkbox"><span class="ccheck__b"></span>Save it!</label>
            <button class="pill pill--wide" id="cartPay">Pay</button>
          </form>
        </div>
      </div>

      <!-- step 4 — the receipt, which then leaves -->
      <div class="paper paper--slip" data-cstep="4">
        <div class="paper__sheet"></div>
        <div class="paper__fold"></div>
        <div class="paper__in">
          <h3 class="paper__t paper__t--slip">Thank You</h3>
          <div class="slip__items" id="slipItems"></div>
        </div>
      </div>
    </section>

    <!-- ── color panel ──────────────────────────────────── -->
    <aside class="colors" id="colors" aria-hidden="true">
      <div class="colors__blur" aria-hidden="true">
        <div></div><div></div><div></div><div></div><div></div><div></div>
      </div>
      <div class="colors__list" id="swatches"></div>
      <button class="colors__close" id="colorsClose" aria-label="Close colors">
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <circle cx="30" cy="30" r="27" fill="none" stroke="#FFFFFF" stroke-width="3"/>
          <path d="M21 21 L39 39 M39 21 L21 39" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </button>
    </aside>

  </div>
</div>

<!-- The layout is portrait-only; sideways it would need a third composition. -->
<div class="rotate" aria-hidden="true"><span>Turn your phone upright</span></div>

<script src="../logo.js"></script>
<script src="../icons.js"></script>
<script src="../shapes.js"></script>
<script src="../intro.js"></script>
<script src="../cart.js"></script>
<script src="../make.js"></script>
<script src="../profile.js"></script>
<script src="../checkout.js"></script>
<script src="app.js"></script>
</body>
</html>
