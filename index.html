<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- A phone (or a small tablet) gets the portrait build in /m, which is laid
     out on its own 390-wide artboard; this page is authored on 1920 x 1080 and
     would land at about a fifth of its size. ?desktop=1 stays here on purpose,
     for when this version has to be shown on a handset. -->
<script>
(function(){
  try{
    if (location.search.indexOf('desktop=1') >= 0) return;
    var narrow = matchMedia('(max-width: 820px)').matches;
    var touch  = matchMedia('(pointer: coarse)').matches && innerWidth <= 1024;
    if (narrow || touch) location.replace('m/index.html' + location.hash);
  }catch(e){}
})();
</script>
<title>TURNitURE — Turn It Yours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Playfair+Display:wght@700&family=Archivo+Black&family=Space+Mono:wght@700&family=Caveat:wght@700&family=Abril+Fatface&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">

    <!-- ── header ───────────────────────────────────────── -->
    <header class="header">
      <a class="logo" href="#" data-go="home" aria-label="TURNitURE home"></a>
      <div class="navbox" id="navbox" aria-hidden="true"></div>
      <nav class="nav">
        <span class="nav__pre">You can change</span>
        <button class="nav__tab" data-tab="images">Image</button>
        <button class="nav__tab" data-tab="sounds">Sound</button>
        <button class="nav__tab" data-tab="colors">Colors</button>
      </nav>
    </header>

    <!-- ── main page ────────────────────────────────────── -->
    <section class="page page--home is-on" data-page="home">
      <h1 class="intro" id="intro">
        <span class="intro__line" id="introWord"><span class="intro__fx"><span class="word" id="word"></span></span></span>
        <span class="intro__line" id="introTagline"><span class="intro__fx">Turn It Yours</span></span>
        <span class="intro__line" id="introLogo"><span class="intro__fx"></span></span>
      </h1>
    </section>

    <!-- ── images / sounds page ─────────────────────────── -->
    <section class="page page--picker" data-page="picker">
      <h2 class="picker__title" data-title>Turn your image into</h2>

      <div class="window" id="window"><div class="items" id="items"></div></div>

      <button class="arrow arrow--prev" id="prev" aria-label="Previous">
        <svg viewBox="0 0 62 62" width="62" height="62" aria-hidden="true">
          <circle cx="31" cy="31" r="31" fill="currentColor"/>
          <path d="M26 17 L41 31 L26 45" fill="none" stroke="var(--bg)" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="arrow arrow--next" id="next" aria-label="Next">
        <svg viewBox="0 0 62 62" width="62" height="62" aria-hidden="true">
          <circle cx="31" cy="31" r="31" fill="currentColor"/>
          <path d="M26 17 L41 31 L26 45" fill="none" stroke="var(--bg)" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>

    <!-- ── make page (step 2 · 3) ───────────────────────── -->
    <section class="page page--make" data-page="make">
      <h2 class="make__title">Let&rsquo;s Make <span data-make-name></span></h2>

      <!-- step 2 — pick an input -->
      <div class="make__io" data-step="io">
        <button class="drop" data-kind="file">
          <span class="drop__label" data-drop-label>Drop Image</span>
          <input type="file" hidden data-file>
        </button>
        <span class="make__or">OR</span>
        <button class="drop" data-kind="live">
          <video class="drop__cam" playsinline muted hidden></video>
          <span class="drop__label" data-live-label>Live Image</span>
        </button>
      </div>

      <!-- step 3 — the result: what went in on the left, what came out on the right -->
      <div class="make__out" data-step="out">
        <canvas class="make__src" data-src></canvas>
        <canvas class="make__canvas" data-canvas></canvas>
        <div class="scrub" data-scrub hidden>
          <div class="scrub__track"></div>
          <div class="scrub__knob" data-knob></div>
        </div>
        <div class="make__btns">
          <button class="rbtn" data-play aria-label="Play">
            <svg viewBox="0 0 92 92" aria-hidden="true">
              <path class="i-play" d="M36 28 L66 46 L36 64 Z"/>
              <path class="i-pause" d="M34 28h10v36H34z M48 28h10v36H48z"/>
            </svg>
          </button>
          <button class="rbtn rbtn--mode" data-mode>2D</button>
          <button class="rbtn rbtn--cart" data-cart>Cart</button>
          <button class="rbtn rbtn--again" data-again aria-label="Again">
            <svg viewBox="0 0 92 92" aria-hidden="true">
              <path d="M62 34a22 22 0 1 0 5 15" fill="none" stroke="currentColor"
                    stroke-width="8" stroke-linecap="round"/>
              <path d="M66 22v16H50"  fill="none" stroke="currentColor"
                    stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ── color panel ──────────────────────────────────── -->
    <aside class="colors" id="colors" aria-hidden="true">
      <div class="colors__blur" aria-hidden="true">
        <div></div><div></div><div></div><div></div><div></div><div></div>
      </div>
      <div class="colors__list" id="swatches"></div>
      <button class="colors__close" id="colorsClose" aria-label="Close colors">
        <svg viewBox="0 0 60 60" width="60" height="60" aria-hidden="true">
          <circle cx="30" cy="30" r="27" fill="none" stroke="#FFFFFF" stroke-width="3"/>
          <path d="M21 21 L39 39 M39 21 L21 39" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </button>
    </aside>

    <div class="cursor" id="cursor"><div class="cursor__dot"></div></div>
  </div>
</div>
<script src="logo.js"></script>
<script src="shapes.js"></script>
<script src="intro.js"></script>
<script src="make.js"></script>
<script src="app.js"></script>
</body>
</html>
